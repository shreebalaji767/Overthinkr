name: Deploy Overthinkr to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'source-index.html'
      - 'src/**'
      - 'public/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.js'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: overthinkr-pages-deploy
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Restore Vite source entry
        run: cp source-index.html index.html
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build site
        run: npm run build
      - name: Verify production output
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/index.html
          test -f dist/manifest.webmanifest
          test -f dist/overthinkr-icon.svg
          test -f dist/sw.js
          grep -Eq 'src="[^"]*/assets/[^"]+\.js"' dist/index.html
          grep -Eq 'href="[^"]*manifest\.webmanifest"' dist/index.html
          grep -Eq 'href="[^"]*overthinkr-icon\.svg"' dist/index.html
          if grep -Eq '(/src/main\.jsx|%BASE_URL%)' dist/index.html; then
            echo "Build output contains unprocessed Vite source paths or placeholders."
            exit 1
          fi
          if grep -q 'text/jsx' dist/index.html; then
            echo "Production HTML must not load JSX source directly."
            exit 1
          fi
          echo "Production bundle, manifest, icon, and service worker verified."
      - name: Publish compiled files to branch root
        shell: bash
        run: |
          set -euo pipefail
          rm -rf assets
          cp -a dist/. .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- index.html assets .nojekyll manifest.webmanifest overthinkr-icon.svg sw.js
          if git diff --cached --quiet; then
            echo "Compiled site is already up to date."
          else
            git commit -m "Publish compiled Overthinkr site"
            git push origin HEAD:main
          fi
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
