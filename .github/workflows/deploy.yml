name: Deploy Overthinkr to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: overthinkr-pages-deploy
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build site
        run: npm run build
      - name: Verify production output
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/index.html
          test -f dist/manifest.webmanifest
          test -f dist/overthinkr-icon.svg
          test -f dist/sw.js
          grep -Eq 'src="(/Overthinkr|\.)/assets/[^"]+\.js"' dist/index.html
          grep -Eq 'href="(/Overthinkr|\.)/manifest\.webmanifest"' dist/index.html
          grep -Eq 'href="(/Overthinkr|\.)/overthinkr-icon\.svg"' dist/index.html
          if grep -Eq '(/src/main\.jsx|%BASE_URL%)' dist/index.html; then
            echo "Build output contains unprocessed Vite source paths or placeholders."
            exit 1
          fi
          echo "Production bundle and public assets verified."
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
